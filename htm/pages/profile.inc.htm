      <div class="container" data-menu_display="user" data-menu_name="Profil" data-menu_sort="10" id="profile">
        <img alt="Logo Profil" class="mt-3 profile" src="img/user/0.png" title="Benutzerprofil" />
        <h2 class="mt-3">Benutzerprofil</h2>
        <form id="profile_form">
          <input id="profile_id" name="profile_id" type="hidden" value="" />
          <input id="profile_sub" name="profile_sub" type="hidden" value="" />
          <input id="profile_role" name="profile_role" type="hidden" value="" />
          <input id="profile_username" name="profile_username" type="hidden" value="" />
          <fieldset>
            <legend>Lokale Daten</legend>
            <div class="mb-3">
              <label for="profile_first_name" class="form-label">Vorname</label>
              <input class="form-control" id="profile_first_name" name="profile_first_name" type="text" value="" />
            </div>
            <div class="mb-3">
              <label for="profile_last_name" class="form-label">Nachname</label>
              <input class="form-control" id="profile_last_name" name="profile_last_name" type="text" value="" />
            </div>
            <button class="btn btn-primary" id="profile_save_btn" type="button">Speichern</button>
          </fieldset>
        </form>
        <div class="alert alert-info" id="profile_alert_info" role="alert" style="display:none;">
          A simple info alert—check it out!
        </div>
      </div>
