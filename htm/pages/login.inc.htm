      <!-- ************************************************************************************************************
           L O G I N   P A G E  (Container)
           ******************************************************************************************************** -->
      <div class="container" data-menu_display="" data-menu_name="Anmelden" data-menu_sort="0" id="login">
        <img alt="Logo" src="./img/android-chrome-192x192.png" title="Logo" />
        <h2 class="mt-3">Anmeldung</h2>
        <p>Die Anmeldung bzw. Registrierung erfolgt am lokalen OAuth2-Server:</p>
        <div class="d-flex justify-content-center">
          <div class="d-grid gap-2">
            <button class="btn btn-lg btn-primary" id="login_oauth" type="button">Hier anmelden</button>
            <button class="btn btn-lg btn-secondary" id="login_oauth_register" type="button">Hier registrieren</button>
          </div>
        </div>
        <div class="alert alert-primary" id="login_alert_box" role="alert" style="display:none;">
          Der lokale OAuth2-Server ist offline. Eine Anmeldung bzw. 
          Registrierung ist nicht möglich.
        </div>
      </div>
